# Lint and test on every push and pull request. No API keys: tests use a
# scripted fake LLM, fake search and in-memory databases (PROJECT_PLAN §8.1).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-ci.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
      - name: Golden set labels exist
        run: python -m evals.golden --check

- id: scenario-1
  category: scenario
  question: A customer deposited RM20,000 in cash and withdrew RM10,000 in cash from the same account today. Do we need to report it?
  # deposits and withdrawals are aggregated, not offset (21.3.2 uses this exact example); 5 working days
  expected_paragraphs: ["amlcft:21.3.1", "amlcft:21.3.2", "amlcft:21.4.3"]
  expected_outcome: answer
- id: scenario-2
  category: scenario
  question: A customer keeps depositing cash just under RM25,000 at different cash deposit machines. What should I do?
  # suspicion regardless of amount; internal report via the branch compliance officer; the CO evaluates and submits
  expected_paragraphs: ["amlcft:22.1.1", "amlcft:22.2.1", "amlcft:22.2.3"]
  expected_outcome: answer
- id: scenario-3
  category: scenario
  question: How do I decide whether a customer is laundering money?
  # the policy asks for suspicion-based reporting and internal red flags, not a verdict on the customer
  expected_paragraphs: ["amlcft:22.1.1", "amlcft:22.3.1", "amlcft:22.3.2"]
  expected_outcome: answer
- id: scenario-4
  category: scenario
  question: The customer asked me whether we reported them to Bank Negara. What can I tell them?
  expected_paragraphs: ["amlcft:23.1"]
  expected_outcome: answer
- id: scenario-5
  category: scenario
  question: A new customer refuses to give me their identity documents. Can I still open the account for them?
  expected_paragraphs: ["amlcft:14A.16.1"]
  expected_outcome: answer
- id: scenario-6
  category: scenario
  question: My new customer is the brother of a government minister. Do I need to do anything extra?
  # PEP rules cover family members; domestic PEP -> assess risk -> enhanced CDD if higher risk (source of wealth and funds)
  expected_paragraphs: ["amlcft:15.1.1", "amlcft:15.3.2", "amlcft:15.3.4", "amlcft:14A.12.1"]
  expected_outcome: answer
- id: scenario-7
  category: scenario
  question: A customer's name matches an entry on the Domestic List. What must we do?
  # the Domestic List is only in para 27 (terrorism financing); confirm a true match, freeze, report an STR
  expected_paragraphs: ["amlcft:27.4.8", "amlcft:27.6.1", "amlcft:27.8.1"]
  expected_outcome: answer
- id: scenario-8
  category: scenario
  question: A tourist wants to change RM5,000 worth of US dollars at our counter. What information must I collect?
  expected_paragraphs: ["amlcft:14C.12.1"]
  expected_outcome: answer
  sector: money_services
- id: scenario-9
  category: scenario
  question: We are launching online account opening with face matching. What must we have in place?
  expected_paragraphs: ["ekyc:8.1", "ekyc:8.4", "ekyc:8.20", "ekyc:8.22"]
  expected_outcome: answer
- id: scenario-10
  category: scenario
  question: Can we open accounts for companies online through e-KYC?
  expected_paragraphs: ["ekyc:8.12", "ekyc:8.13", "ekyc:8.18"]
  expected_outcome: answer
- id: scenario-11
  category: scenario
  question: A customer complained about our service. How many days do we have to resolve the complaint?
  # FTFC sets no number of days: senior management sets the timeframes. An answer that gives a number invents it
  expected_paragraphs: ["ftfc:15.4"]
  expected_outcome: answer
- id: scenario-12
  category: scenario
  question: An elderly customer with no investment experience wants to buy an investment-linked insurance policy. Can I sell it to them?
  expected_paragraphs: ["ftfc:16.9", "ftfc:16.10"]
  expected_outcome: answer


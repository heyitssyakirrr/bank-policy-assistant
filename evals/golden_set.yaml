# The golden set: questions with their answer key (PROJECT_PLAN §8.2).
#
# How it was built (disclosed in the report):
#   1. Claude Code read chunks.jsonl and picked paragraphs across the three
#      documents and every category; each question was written from the
#      paragraph text, and those paragraphs are the gold labels.
#   2. Hard cases (comparisons, cross-references, follow-ups, out-of-scope,
#      ambiguous) were written by hand from the actual paragraph text.
#   3. `python -m evals.golden --show` prints every question with its gold
#      paragraphs' text, for re-reading and for Syakir's spot-check (>= 10 items).
#      Who checked what is recorded in evals/golden_review.yaml and printed in every report.
#
# Fields:
#   expected_paragraphs  "doc:paragraph" for the main body, "doc:Appendix N:paragraph" for appendices
#   expected_outcome     answer | refuse | clarify
#   sector               the user's sector (the sidebar choice); default banking. Sector items use the
#                        sector they ask about; followup-1 keeps banking on purpose (the follow-up switches it)
#   previous_turns       earlier questions in the same conversation (follow-ups)

- id: lookup-1
  category: direct_lookup
  question: What does paragraph 14A.9.6 of the AML/CFT policy document require?
  expected_paragraphs: ["amlcft:14A.9.6"]
  expected_outcome: answer
- id: lookup-2
  category: direct_lookup
  question: What does e-KYC paragraph 8.21 say?
  expected_paragraphs: ["ekyc:8.21"]
  expected_outcome: answer
- id: lookup-3
  category: direct_lookup
  question: What does paragraph 9.1 of the Fair Treatment of Financial Consumers policy require?
  expected_paragraphs: ["ftfc:9.1"]
  expected_outcome: answer
- id: lookup-4
  category: direct_lookup
  question: What does paragraph 24.3 of the AML/CFT policy document say?
  expected_paragraphs: ["amlcft:24.3"]
  expected_outcome: answer


- id: fact-3
  category: paraphrased
  question: Can e-KYC be done entirely by a human reviewer, without any AI?
  expected_paragraphs: ["ekyc:8.26", "ekyc:8.27", "ekyc:8.28"]
  expected_outcome: answer
- id: fact-4
  category: paraphrased
  question: Does a bank have to publish its commitment to treating customers fairly?
  expected_paragraphs: ["ftfc:9.1"]
  expected_outcome: answer
- id: fact-5
